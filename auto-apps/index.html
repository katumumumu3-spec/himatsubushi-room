<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>ひまつぶし自動アプリ置き場</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #263044;
        --coral: #ff6b6b;
        --paper: #fffaf1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top left, #ffe8c8, var(--paper));
        color: var(--ink);
        font-family: "Segoe UI", "Hiragino Sans", sans-serif;
        text-align: center;
      }
      main {
        max-width: 520px;
        padding: 32px;
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 24px;
        box-shadow: 6px 7px 0 var(--ink);
      }
      a {
        color: var(--coral);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ひまつぶし自動アプリ置き場</h1>
      <p>
        このサイトは日次自動生成アプリの公開用ホストです。<br />
        遊べる一覧は
        <a href="https://himatsubushiroom.com/">ひまつぶしルーム</a>
        を見てください。
      </p>
    </main>
  </body>
</html>
