<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スイーツ神経衰弱</title>
  <meta name="description" content="ドーナツやケーキのカードを揃える甘い神経衰弱です。" />
  <style>
    :root { --ink:#263044; --coral:#ff6b6b; --mint:#58d6b0; --paper:#fffaf1; --yellow:#ffd166; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:"Segoe UI","Hiragino Sans",sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0%,#ffe7c2,var(--paper)); }
    .wrap { width:min(560px,calc(100% - 24px)); margin:0 auto; padding:20px 0 40px; }
    h1 { margin:0 0 8px; font-size:1.45rem; }
    .lead { margin:0 0 16px; color:#667085; font-size:.92rem; line-height:1.6; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-weight:700; }
    .board { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .card { aspect-ratio:1; border:2px solid var(--ink); border-radius:14px; background:#fff; box-shadow:3px 3px 0 var(--ink); font-size:1.6rem; display:grid; place-items:center; cursor:pointer; user-select:none; transition:transform .15s; }
    .card:hover { transform:translateY(-2px); }
    .card.is-back { background:linear-gradient(145deg,var(--coral),#ff8e53); color:transparent; }
    .card.is-matched { background:var(--mint); cursor:default; box-shadow:none; }
    .msg { margin-top:14px; min-height:1.4em; font-weight:800; }
    .room { display:inline-block; margin-top:18px; color:var(--coral); font-weight:800; }
    button { border:2px solid var(--ink); border-radius:12px; background:var(--yellow); font-weight:800; padding:8px 14px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>スイーツ神経衰弱</h1>
    <p class="lead">ドーナツやケーキのカードを揃える甘い神経衰弱です。</p>
    <div class="bar">
      <span>手数: <strong id="moves">0</strong></span>
      <span>残り: <strong id="left">0</strong></span>
      <button type="button" id="restart">やり直す</button>
    </div>
    <div class="board" id="board"></div>
    <p class="msg" id="msg"></p>
    <style>
  .ad-slot-wrap{margin:18px 0 8px;text-align:center}
  .ad-slot-wrap .ad-label{margin:0 0 6px;color:#667085;font-size:.75rem;font-weight:700}
  .ad-slot{min-height:50px}
</style>
<aside class="ad-slot-wrap" aria-label="スポンサー">
  <p class="ad-label">スポンサー</p>
  <div class="ad-slot" id="admaxBottom"></div>
</aside>
<script>
(function () {
  var admaxId = "b9edd449a024966b9a7fcfb7435c5378";
  var el = document.getElementById("admaxBottom");
  if (!el || !admaxId) return;
  var iframe = document.createElement("iframe");
  iframe.title = "advertisement";
  iframe.setAttribute("scrolling", "no");
  iframe.setAttribute("frameborder", "0");
  iframe.style.cssText = "display:block;width:100%;max-width:320px;height:100px;border:0;margin:0 auto;overflow:hidden;";
  iframe.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;padding:0;text-align:center;background:transparent;"><script src="https://adm.shinobi.jp/s/' + admaxId + '"><\/script></body></html>';
  el.appendChild(iframe);
})();
</script>
    <a class="room" href="https://himatsubushiroom.com/" target="_blank" rel="noopener">もっと遊ぶ → ひまつぶしルーム</a>
  </div>
  <script>
    const CONFIG = {"pairs":8,"theme":"sweets"};
    const THEMES = {
      fruits: ["🍎","🍌","🍇","🍓","🍑","🍍","🥝","🍊","🍉","🍒"],
      animals: ["🐶","🐱","🐰","🦊","🐻","🐼","🐸","🐵","🐷","🦄"],
      sweets: ["🍩","🍪","🍰","🧁","🍫","🍬","🍭","🍮","🍦","🥧"],
      space: ["🚀","🌟","🌙","🪐","☄️","👽","🛸","🌌","🛰️","🌑"],
      default: ["⭐","❤️","🍀","🎵","🔥","💧","⚡","🌈","🎯","🎲"]
    };
    const pairs = Math.min(Math.max(Number(CONFIG.pairs) || 8, 4), 10);
    const theme = THEMES[CONFIG.theme] || THEMES.default;
    const symbols = theme.slice(0, pairs);
    let first = null, lock = false, moves = 0, matched = 0;
    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const leftEl = document.getElementById("left");
    const msg = document.getElementById("msg");

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function start() {
      first = null; lock = false; moves = 0; matched = 0;
      movesEl.textContent = "0";
      leftEl.textContent = String(pairs);
      msg.textContent = "";
      board.innerHTML = "";
      const deck = shuffle([...symbols, ...symbols]);
      deck.forEach((symbol, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card is-back";
        btn.dataset.symbol = symbol;
        btn.dataset.index = String(index);
        btn.setAttribute("aria-label", "カード");
        btn.addEventListener("click", () => flip(btn));
        board.appendChild(btn);
      });
    }

    function flip(card) {
      if (lock || card.classList.contains("is-matched") || !card.classList.contains("is-back")) return;
      card.classList.remove("is-back");
      card.textContent = card.dataset.symbol;
      if (!first) { first = card; return; }
      moves += 1;
      movesEl.textContent = String(moves);
      if (first.dataset.symbol === card.dataset.symbol) {
        first.classList.add("is-matched");
        card.classList.add("is-matched");
        first = null;
        matched += 1;
        leftEl.textContent = String(pairs - matched);
        if (matched === pairs) msg.textContent = `クリア！ ${moves} 手で完成`;
      } else {
        lock = true;
        const a = first, b = card;
        first = null;
        setTimeout(() => {
          a.classList.add("is-back"); a.textContent = "";
          b.classList.add("is-back"); b.textContent = "";
          lock = false;
        }, 650);
      }
    }

    document.getElementById("restart").addEventListener("click", start);
    start();
  </script>
</body>
</html>
